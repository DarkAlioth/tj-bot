[project]
name = "tj-bot"
version = "0.1.0"
description = "Telegram bot for torrent search via Jackett with PostgreSQL-backed result cache"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.12.0",
    "pydantic-settings>=2.14.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.31.0",
    "alembic>=1.18.0",
]

[project.scripts]
tj-bot = "tj_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tj_bot"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "mypy>=2.3.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "bandit>=1.9.0",
    "pip-audit>=2.10.0",
    "types-python-dateutil>=2.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "ANN", "B", "C4", "PTH", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are fine in tests

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source_pkgs = ["tj_bot"]
# main.py is polling wiring verified by the deploy smoke check; migrations
# run in CI via the integration fixture
omit = [
    "*/main.py",
    "*/db/migrations/*",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", "data", "Jackett"]
