<script>
const W=window.TelegramWidget,$=i=>document.getElementById(i),D=matchMedia('(prefers-reduced-motion:reduce)').matches?0:1,DOTS='<i class=dots><b></b><b></b><b></b></i>',
E=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt()+';'),T=(c,h)=>`<div class="${c}">${h}</div>`,B=(c,a,h,d)=>`<button class="${c}" data-a="${a}"${d?' disabled':''}>${h}</button>`,

fI=n=>String(n||0).replace(/\B(?=(\d{3})+$)/g,' '),hap=(k,v)=>{try{W.HapticFeedback[k](v)}catch(e){}},ok=t=>{hap('notificationOccurred','success');toast(t)},
chip=(x,c='')=>x?`<span class="ch${c}">${E(x)}</span>`:'',tile=(v,l,c='',r='')=>'<div>'+T('v',r+'<span class=el>'+v+'</span>')+T('l el'+c,l)+'</div>',ctx=(s=S.s)=>`${S.qh}:${S.i|0}:${s}:${S.f}:${S.c}`;
let S={},R=0,X=0,busy=0,tt=0,M={},x0,dx,sw;
function parse(){try{S=JSON.parse(W.chatData)||{}}catch(e){S={}}R=Math.max(R,S.r||0)}

function err(m,fail){hap('notificationOccurred','error');fail?fail(m):toast(m,1)}
function rq(d,el,ok,fail){if(!W||busy)return;busy=1;document.body.classList.add('p');el&&el.insertAdjacentHTML('beforeend',DOTS);
W.request(d).then(a=>{let j={};try{j=JSON.parse(a.result)||{}}catch(e){}j.err?err(j.err,fail):ok(j)},e=>err(ERR[(e.code||'F')[0]]||ERR.F,fail)).finally(()=>{busy=0;document.body.classList.remove('p');el&&el.lastChild.remove()})}
function apply(j,d){if(j.v){S=j;X=0}else Object.assign(S,j);R=Math.max(R,j.r||0);hap('selectionChanged');if(!d||!D)return draw();$('b').animate([{transform:'none'},{transform:`translateX(${-24*d}px)`,offset:.5},{transform:`translateX(${24*d}px)`,offset:.5},{transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});setTimeout(draw,110)}
function go(d,el,dir,fail){rq(d,el,j=>j.v?apply(j,dir):draw(),fail)}

ml=(S.ml?T('el',E(S.ml)):'')+(pp?T('el pp',E(pp)):'')+(S.aa?T('el aa',E(S.aa)):'')+(S.en&&!S.ml?T('','загружаем детали'+DOTS):''),

const nv=()=>{const i=S.i|0,n=S.n|0;return T('rw nv',B('g sq','p','‹',!i)+B('g c','s',E(S.sl||'Сиды ↓'))+B('g c','fs','Фильтры'+(S.fa?' <b class=k>•</b>':''))+B('g c','ls','Список')+B('g sq','n','›',i+1>=n))};
function draw(){const n=S.n|0,i=S.i|0;document.body.className=X?'x':'';
if(!S.v){$('h').innerHTML='';$('b').innerHTML=T('em','Нет данных');return}
$('h').innerHTML=chip(S.tk,' ac')+chip(S.cn)+(S.fc?chip('⚡ кэш',' fc'):'')+(n?`<span class="m el ix">${fI(Math.min(i+1,n))} / ${fI(n)}</span>`:'');
$('b').innerHTML=S.h?card():T('em','Ничего не найдено'+(S.fa?' с этими фильтрами':''))+nv();tt||foot()}
function nav(k,el){const d=k=='n'?1:-1,i=(S.i|0)+d;if(i<0||i>=S.n)return;go(k+':'+ctx(),el,d)}
function act(a,el){const b=el.tagName=='BUTTON'?el:null,hp=()=>hap('impactOccurred','light');
if(a=='n'||a=='p')return nav(a,b);
if(a=='s'){hp();return go('s:'+ctx(SK[(SK.indexOf(S.s)+1)%5]),b,1)}
if(a=='ls'||a=='fs')return rq(a+':'+ctx(),b,j=>j.v?apply(j):0);
if(a=='d')return rq('d:'+S.h,b,()=>ok('Файл отправлен'));
if(a=='srv')return rq('srv:'+S.h,b,()=>ok('Отправлено на сервер'));
if(a=='fav'){const fl=()=>{S.fav=S.fav?0:1;draw()};fl();hp();return rq('fav:'+S.h,0,j=>{S.fav=j.fav??S.fav;R=Math.max(R,j.r||0);draw()},m=>{fl();toast(m,1)})}
if(a=='u'){try{W.openLink(S.u)}catch(e){}return}
if(a=='more'){if(X||M[S.h]||!S.pm){X=X?0:1;return draw()}return rq('more:'+S.h,0,j=>{M[S.h]=j;X=1;draw()})}
}
document.onclick=e=>{const t=e.target.closest('[data-a]');t&&act(t.dataset.a,t)};
document.onpointerdown=e=>{sw=e.target.closest('.sw');if(sw){x0=e.clientX;dx=0;sw.setPointerCapture(e.pointerId)}};
document.onpointermove=e=>{if(sw){dx=e.clientX-x0;if(Math.abs(dx)>9)sw.style.transform=`translateX(${dx*((dx>0?!S.i:S.i>=S.n-1)?.12:.45)}px)`}};
document.onpointerup=e=>{if(sw){sw.style.transform='';sw=0;Math.abs(dx)>55&&nav(dx<0?'n':'p')}};
document.onpointercancel=()=>{if(sw){sw.style.transform='';sw=0}};
if(W){W.onEvent('chatDataChanged',()=>{const o=S,r=R;parse();S.r>r?draw():S=o});parse()}
draw();W&&W.ready&&W.ready();
</script>
