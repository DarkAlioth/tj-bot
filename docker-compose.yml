services:
  bot:
    build: .
    container_name: torrent_search_bot
    restart: unless-stopped
    volumes:
      - ./Jackett/Jackett:/config:ro
    env_file:
      - .env
    depends_on:
      - db
      - jackett
    networks:
      - app_network

  jackett:
    image: linuxserver/jackett
    container_name: jackett
    restart: unless-stopped
    ports:
      - "9117:9117"
    volumes:
      - ./Jackett:/config
    networks:
      - app_network

  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
