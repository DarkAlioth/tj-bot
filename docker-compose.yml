x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  bot:
    build: .
    container_name: torrent_search_bot
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    volumes:
      - ./Jackett/Jackett:/config:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      jackett:
        condition: service_started
    networks:
      - app_network
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  jackett:
    image: linuxserver/jackett
    container_name: jackett
    restart: unless-stopped
    <<: *hardening
    # bound to loopback: reach the UI via SSH tunnel, not the LAN
    ports:
      - "127.0.0.1:9117:9117"
    volumes:
      - ./Jackett:/config
    healthcheck:
      # liveness = Jackett answers HTTP at all; its root 301-redirects to a
      # cookie-test URL that -fL cannot follow, so probe a stable API path
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9117/api/v2.0/server/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app_network
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    container_name: flaresolverr
    restart: unless-stopped
    <<: *hardening
    # no ports: only Jackett calls it (set FlareSolverrUrl=http://flaresolverr:8191)
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8191/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    <<: *hardening
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

networks:
  app_network:
    driver: bridge
